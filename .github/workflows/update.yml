name: update

# Updates bucket/hivemend.json to the latest published Hivemend release. Runs
# every six hours and on demand, with this repository's own token, so no
# secret is needed in either repository.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --exclude-drafts/prereleases: only what users should get.
          tag=$(gh release list --repo Tuigse-oss/HiveMend --exclude-drafts --exclude-pre-releases \
                  --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "No published Hivemend release yet."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.tag != ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.tag != ''
        with:
          repository: Tuigse-oss/HiveMend
          ref: ${{ steps.latest.outputs.tag }}
          path: hivemend
          sparse-checkout: packaging
          persist-credentials: false
      - name: Render and commit the manifest
        if: steps.latest.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          gh release download "$TAG" --repo Tuigse-oss/HiveMend --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
          python3 hivemend/packaging/render.py "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS.txt" "$RUNNER_TEMP/out"
          mkdir -p bucket
          cp "$RUNNER_TEMP/out/scoop/hivemend.json" bucket/hivemend.json
          git add bucket/hivemend.json
          if git diff --cached --quiet; then
            echo "bucket/hivemend.json is already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "hivemend: update to ${TAG#v}"
          git push
      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows in a public repository after
        # 60 days without activity, and Hivemend can go that long without a
        # release. After 50 days with no commit, push an empty one.
        if: steps.latest.outputs.tag != ''
        run: |
          quiet=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$quiet" -lt 50 ]; then
            echo "Last commit $quiet days ago; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the scheduled update alive ($quiet days without a commit)"
          git push

  report:
    name: report a failed scheduled run
    # A failed scheduled run only notifies whoever last edited its schedule,
    # so open an issue (or comment on the one already open) to make the
    # failure seen and tracked until it is fixed.
    needs: [update]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled $WORKFLOW run failed"
          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "A scheduled workflow run failed" 2>/dev/null || true
          number=$(TITLE="$title" gh issue list --repo "$REPO" --state open --label ci-failure \
            --json number,title --jq '[.[] | select(.title == $ENV.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            body=$(printf 'The scheduled **%s** workflow failed: %s\n\nClose this issue once it passes again.' "$WORKFLOW" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --label ci-failure --body "$body"
          fi
